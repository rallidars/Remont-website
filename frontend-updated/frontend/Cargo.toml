[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
yew={version="0.22.0", features=["csr"]}
yew-hooks="0.4.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo="0.11.0"
gloo-timers="0.3.0"
gloo-utils="0.2.0"
gloo-events="0.2.0"
serde_json="1.0.149"
serde="1.0.228"
thiserror="2.0.18"
gloo-net = "0.2.5"
gloo-console="0.3.0"
log ="0.4.27"


[dependencies.web-sys]
version = "0.3.60"
features = [
  "HtmlInputElement",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Animation",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "ScrollOptions",
  "ScrollToOptions",
  "ScrollBehavior",
  "HtmlSelectElement",
  "Clipboard",  
  "DomRect",
  "ScrollIntoViewOptions",
  "ScrollToOptions"
]
